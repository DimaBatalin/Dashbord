name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          mkdir -p _site
          cp -r index.html styles.css app.js sw.js manifest.webmanifest icons _site/
          if [ -n "$FIREBASE_CONFIG" ]; then
            printf 'window.FIREBASE_CONFIG = %s;\n' "$FIREBASE_CONFIG" > _site/firebase-config.js
          else
            echo "FIREBASE_CONFIG secret is empty: building offline-only version"
            echo 'window.FIREBASE_CONFIG = null;' > _site/firebase-config.js
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
