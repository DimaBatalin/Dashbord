<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Пульт дня</title>
  <meta name="description" content="Расписание дедлайнов, привычки и платежи на одном экране.">
  <meta name="theme-color" content="#EEF1F0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0D1514" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Пульт дня">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script>
    try { var t = localStorage.getItem("daydeck:theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
  </script>
</head>
<body>
<div class="wrap">

  <header class="mast">
    <h1 id="greeting">Добрый день</h1>
    <div class="mast-tools">
      <button class="tbtn" id="editBtn" type="button">Настроить</button>
      <button class="tbtn" id="authBtn" type="button" hidden></button>
      <button class="tbtn" id="expBtn" type="button" title="Сохранить все записи в файл">⤓ Экспорт</button>
      <button class="tbtn" id="impBtn" type="button" title="Загрузить записи из файла">⤒ Импорт</button>
      <input id="impFile" type="file" accept="application/json,.json" hidden>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Переключить тему">
        <span id="themeIcon">◐</span><span id="themeLbl">Тема</span>
      </button>
    </div>
  </header>

  <section class="nowbar" aria-label="Время и прогресс">
    <div class="clock">
      <div class="time" id="clock">--:--<span class="sec" id="sec">00</span></div>
      <div class="date" id="dateline">—</div>
    </div>
    <div class="vr" aria-hidden="true"></div>
    <div class="meters">
      <div class="meter day">
        <div class="m-top"><span class="m-label">День пройден</span><span class="m-val mono" id="dayPct">—</span></div>
        <div class="track"><i id="dayBar"></i></div>
      </div>
      <div class="meter week">
        <div class="m-top"><span class="m-label">Неделя пройдена</span><span class="m-val mono" id="weekPct">—</span></div>
        <div class="track"><i id="weekBar"></i></div>
      </div>
      <div class="meter" id="hwMeter" hidden>
        <div class="m-top"><span class="m-label">Дедлайны на 7 дней</span><span class="m-val mono" id="hwMeta">—</span></div>
        <div class="track"><i id="hwBar"></i></div>
      </div>
      <div class="meter" id="habMeter" hidden>
        <div class="m-top"><span class="m-label">Привычки сегодня</span><span class="m-val mono" id="habMeta">—</span></div>
        <div class="track"><i id="habBar"></i></div>
      </div>
    </div>
  </section>

  <main class="blocks" id="blocks"></main>

</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
